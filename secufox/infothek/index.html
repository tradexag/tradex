<script>
(function(){
  var KEY='tradex-secufox-pw';
  var data=JSON.parse(document.getElementById('payload').textContent);
  function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  async function open(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pw.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(data.s),iterations:data.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(data.i)},key,b64(data.c));
    try{sessionStorage.setItem(KEY,pw)}catch(e){}
    var html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }
  var saved=null;try{saved=sessionStorage.getItem(KEY)}catch(e){}
  if(saved){open(saved).catch(function(){try{sessionStorage.removeItem(KEY)}catch(e){}})}
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();var err=document.getElementById('err');err.textContent='';
    open(document.getElementById('pw').value).catch(function(){err.textContent='Das Passwort stimmt nicht. Bitte noch einmal versuchen.'});
  });
})();
</script>
