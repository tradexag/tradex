<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seite nicht gefunden · TradeX International AG</title>
<meta name="description" content="Diese Seite gibt es nicht.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>@font-face{font-family:'Geist';font-weight:400;font-display:swap;src:url(/assets/fonts/geist-sans-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Geist';font-weight:500;font-display:swap;src:url(/assets/fonts/geist-sans-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Geist';font-weight:700;font-display:swap;src:url(/assets/fonts/geist-sans-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(/assets/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
:root{--ink:#111;--muted:#6A6E73;--line:#E8E8E8;--accent:#D52B1E;--gutter:clamp(16px,4vw,48px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Geist","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
header,main,footer{max-width:820px;margin-inline:auto;padding-inline:var(--gutter)}
header{display:flex;justify-content:space-between;align-items:center;height:64px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;letter-spacing:.06em}
.logo svg{width:22px;height:22px}
.switch{display:flex;gap:4px}
.switch button{font:inherit;background:none;border:1px solid var(--line);padding:6px 10px;cursor:pointer;color:var(--muted)}
.switch button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
main{padding-top:56px;padding-bottom:72px}
.label{display:flex;align-items:center;gap:10px;color:var(--muted);margin-bottom:20px}
.sq{display:inline-block;width:8px;height:8px;background:var(--accent)}
h1{font-size:clamp(34px,6vw,52px);line-height:1.05;letter-spacing:-.03em;margin:0 0 40px}
h2{font-size:20px;letter-spacing:-.01em;margin:40px 0 8px}
p,address{margin:0 0 14px;font-style:normal}
.todo{color:var(--accent)}
footer{border-top:1px solid var(--line);padding-block:24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--muted)}
footer nav{display:flex;gap:20px}
footer a{text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <a class="logo" href="/" aria-label="TradeX International AG, Startseite"><svg viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" fill="#111111"/><path d="M6.5 6.5 L15.5 15.5 M15.5 6.5 L6.5 15.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="square"/></svg><span>TRADEX</span></a>
  <div class="switch mono" role="group" aria-label="Sprache / Language"><button type="button" data-set="de">DE</button><button type="button" data-set="en">EN</button></div>
</header>
<main>
<div data-l="de"><div class="label mono"><i class="sq"></i>404</div>
<h1>Diese Seite gibt es nicht.</h1>
<p><a href="/">Zur Startseite →</a></p></div>
<div data-l="en" hidden><div class="label mono"><i class="sq"></i>404</div>
<h1>This page does not exist.</h1>
<p><a href="/">Back to the homepage →</a></p></div>
</main>
<footer class="mono">
  <span>© 2026 TradeX International AG</span>
  <nav><a href="/">Start</a><a href="/impressum.html"><span data-l="de">Impressum</span><span data-l="en" hidden>Legal notice</span></a><a href="/datenschutz.html"><span data-l="de">Datenschutz</span><span data-l="en" hidden>Privacy</span></a></nav>
</footer>
<script>
(function(){
  function set(l){
    document.documentElement.lang = l;
    document.querySelectorAll('[data-l]').forEach(function(el){ el.hidden = el.getAttribute('data-l') !== l; });
    document.querySelectorAll('[data-set]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-set') === l); });
    try { localStorage.setItem('tradex-lang', l); } catch(e){}
  }
  document.querySelectorAll('[data-set]').forEach(function(b){ b.addEventListener('click', function(){ set(b.getAttribute('data-set')); }); });
  var s = null; try { s = localStorage.getItem('tradex-lang'); } catch(e){}
  set(s === 'en' ? 'en' : 'de');
})();
</script>
</body>
</html>
